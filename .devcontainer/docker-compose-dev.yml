name: "osv.dev"
services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-appdb}"]
      interval: 5s
      timeout: 5s
      retries: 5
  garage:
    image: dxflrs/garage:v2.4.1
    container_name: garage
    restart: unless-stopped
    ports:
      - "3900:3900" # S3 API
      - "3901:3901" # Internal RPC (for clustering)
      - "3902:3902" # S3 Web Static Hosting
      - "3903:3903" # Admin API
    volumes:
      - ../garage/garage.toml:/etc/garage.toml:ro
      - ../garage/meta:/var/lib/garage/meta
      - ../garage/data:/var/lib/garage/data
    environment:
      - RUST_LOG=garage=info
    env_file:
      - ../garage/.env
  garage-init:
    build:
      context: ../garage
      dockerfile: Dockerfile
    depends_on:
      garage:
        condition: service_started
    env_file:
      - ../garage/.env
    volumes:
      - ../garage/init.sh:/init.sh:ro
      - ../garage/config.json:/app/config.json:ro
    command: ["/bin/sh", "/init.sh"]
  dev:
    build: 
      context: .
      dockerfile: Dockerfile
    user: vscode
    command: sleep infinity
    volumes:
      - ..:/workspace:cached
    depends_on:
      - postgres
      - garage
      - garage-init
    ports: 
      #profiling gitter port
      - 6060:6060
      #gitter port
      - 8888:8888
      #profiler report
      - 8089:8089